[project]
name = "freyja-agent"
version = "0.1.0"
description = "General-purpose agent orchestrator built on Deep Agents and served with FastAPI"
readme = "README.md"
authors = [
    { name = "Minh Nguyen", email = "quickbeard@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=1.3,<2",
    "cryptography>=50,<51",
    "deepagents>=0.7.32,<0.8",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "jsonschema>=4.20",
    "langchain-anthropic>=1.7.6",
    "langchain-openai>=1.7.3",
    "langchain-openrouter>=0.2.9",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp>=2.3,<3",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sse-starlette>=3.6.0",
]

[project.scripts]
freyja-api = "freyja_agent.api.app:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    # One exact version: a newer pyright reports more, and the gate has to say the same
    # thing in the commit hook and in both CI systems. The nodejs extra brings Node from
    # PyPI, so nothing but uv is needed to run it.
    "pyright[nodejs]==1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Coverage is measured when pytest is given --cov, as the commit hook and CI give it. A run
# of one file is not measured, so it is not held to the whole suite's number.
[tool.coverage.run]
source = ["freyja_agent"]
# Python 3.12's own monitoring: it adds about a second to the suite, where the default way of
# measuring adds half the suite's time again. On 3.12 it counts lines, not branches.
core = "sysmon"

[tool.coverage.report]
# The share of the service's lines the suite must run, as CI runs it: with the Postgres
# tests, which both CI systems run against a Postgres the job starts. Measured at 96.64 on
# 2026-11-27. A run without a database skips those tests and leaves the Postgres stores
# unmeasured (91.50 on the same day): the commit hook is such a run and holds a floor of its
# own, beside its command in .pre-commit-config.yaml. Raise it as the number rises; lower it
# only with the reason written here.
fail_under = 95
precision = 2
show_missing = true
skip_covered = true

# The type checker, run as `uv run pyright`: by the commit hook and in CI. It checks the
# service's code against the packages in .venv. The tests are not checked yet: they are
# written against fakes and stand-ins whose types are looser than the service's.
[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# Only `# pyright: ignore[rule]` silences a line, so every suppression names its rule. A
# bare `# type: ignore` silences nothing.
enableTypeIgnoreComments = false
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]          # first-party import detection for isort
# workspace holds agent skills and case files, not Python. .specify holds Spec Kit's generated
# scripts and extensions, which are not edited by hand and do not follow this project's rules.
extend-exclude = ["workspace", ".specify"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes: unused imports, undefined names
  "I",        # isort
  "UP",       # pyupgrade: modern 3.12 syntax
  "B",        # bugbear: likely bugs
  "SIM",      # simplify
  "C4",       # comprehensions
  "ASYNC",    # blocking calls inside async code
  "S",        # bandit security checks
  "N",        # pep8 naming
  "PTH",      # prefer pathlib over os.path
  "T20",      # no stray print()
  "ARG",      # unused arguments
  "RUF",      # ruff-specific rules
]
ignore = ["E501"]  # line length is the formatter's job

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG"]            # assert and unused fixtures are normal in tests

[tool.ruff.lint.isort]
known-first-party = ["freyja_agent", "tests"]

[tool.ruff.lint.flake8-bugbear]
# B008 would otherwise flag FastAPI's call-in-default pattern, e.g. db: Session = Depends(get_db)
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header", "fastapi.Body"]

[tool.ruff.format]
docstring-code-format = true
