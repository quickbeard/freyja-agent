# GitLab CI: the linters (Ruff, Biome), the type checker (pyright), and the unit tests
# (pytest, Vitest) of both projects, and the web app's end-to-end tests (Playwright). The
# same jobs run on GitHub from lint.yml, unit-tests.yml, and playwright.yml under
# .github/workflows/. A job added since says in its own comment which workflow it has there.
stages:
  - test

# The linters and the unit tests run on every merge request and on main, whatever changed:
# they are quick.
.every-change:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

ruff:
  extends: .every-change
  # The Python that .python-version names.
  image: python:3.12-slim
  variables:
    UV_LINK_MODE: copy
  before_script:
    - pip install --quiet "uv==0.12.*"
    # Ruff comes from uv.lock, so CI checks with the version a developer has.
    - uv sync --locked
  script:
    # Both report and change nothing; the commit hook is where files get fixed.
    - uv run ruff check .
    - uv run ruff format --check .

# The service's types. The same job runs on GitHub from lint.yml, and the commit hook runs
# the same command.
pyright:
  extends: .every-change
  # The Python that .python-version names.
  image: python:3.12-slim
  variables:
    UV_LINK_MODE: copy
  before_script:
    - pip install --quiet "uv==0.12.*"
    # pyright comes from uv.lock at one exact version, with the Node it runs on, and checks
    # the code against the packages the lock file installs.
    - uv sync --locked
  script:
    # Over src/, as pyproject.toml has it.
    - uv run pyright

biome:
  extends: .every-change
  image: node:26-slim
  before_script:
    - npm install -g pnpm@12
    - cd web
    - pnpm install --frozen-lockfile
  script:
    # biome check: lint and formatting in one command.
    - pnpm lint

# Secrets in any commit. The same job runs on GitHub from secrets.yml, and the commit hook
# runs the same version over what is staged: change the three together.
gitleaks:
  extends: .every-change
  image:
    name: zricethezav/gitleaks:v8.30.1
    # The image starts gitleaks itself; the job needs a shell.
    entrypoint: [""]
  variables:
    # Every commit, not only the last: a secret stays in the history after it is removed.
    GIT_DEPTH: 0
  script:
    # --redact: a finding is reported without the value, which a log would keep. The rules
    # and the made-up keys of the tests that are let through are in .gitleaks.toml.
    - gitleaks git --redact --no-banner .

pytest:
  extends: .every-change
  # The Python that .python-version names.
  image: python:3.12-slim
  variables:
    # The cache and the environment may sit on different file systems on a runner.
    UV_LINK_MODE: copy
  before_script:
    - pip install --quiet "uv==0.12.*"
    # --locked fails when uv.lock is out of step with pyproject.toml instead of rewriting it.
    - uv sync --locked
  script:
    # The Postgres tests under tests/integration are skipped: they are opt-in and need
    # FREYJA_TEST_DATABASE_URI. --cov: with coverage, held to fail_under in pyproject.toml.
    - uv run pytest --cov

vitest:
  extends: .every-change
  image: node:26-slim
  before_script:
    - npm install -g pnpm@12
    - cd web
    - pnpm install --frozen-lockfile
  script:
    # With coverage, held to the thresholds in web/vitest.config.mts.
    - pnpm test:coverage

playwright:
  stage: test
  # The image carries the browsers and their system packages. Its version must equal
  # the @playwright/test version in web/pnpm-lock.yaml; change both together.
  image: mcr.microsoft.com/playwright:v1.65.1-noble
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - web/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - web/**/*
        - .gitlab-ci.yml
  before_script:
    - npm install -g pnpm@12
    - cd web
    - pnpm install --frozen-lockfile
  script:
    # Playwright builds the app and serves it itself (web/playwright.config.ts).
    - pnpm exec playwright test
  artifacts:
    when: always
    paths:
      - web/playwright-report/
    expire_in: 30 days

# Trivy over the source: known vulnerabilities in what uv.lock and web/pnpm-lock.yaml install,
# and mistakes in the Dockerfiles. The same job runs on GitHub from scan.yml: change the
# version in both. GitHub also builds, runs, and scans the two images; that job has no twin
# here, because building an image needs a runner that allows it. The dev deploy pipeline
# scans the images it builds.
trivy:
  extends: .every-change
  image:
    name: aquasec/trivy:0.76.2
    # The image starts Trivy itself; the job needs a shell.
    entrypoint: [""]
  script:
    - >-
      trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1
      --skip-dirs .venv --skip-dirs web/node_modules --skip-dirs web/.next .

# Semgrep over the source. The same job runs on GitHub from scan.yml: change the version in
# both. --error: any finding fails. --metrics=off: nothing about the repository is sent; the
# rules are fetched, which is why they are named and `auto` is not used.
semgrep:
  extends: .every-change
  image: semgrep/semgrep:1.178.0
  script:
    - >-
      semgrep scan --metrics=off --error
      --config p/default --config p/security-audit --config p/owasp-top-ten
      --config p/dockerfile .
