# GitLab CI: the linters (Ruff, Biome), the type checker (pyright), and the unit tests
# (pytest, Vitest) of both projects, and the web app's end-to-end tests (Playwright). The
# same jobs run on GitHub from lint.yml, unit-tests.yml, and playwright.yml under
# .github/workflows/. A job added since says in its own comment which workflow it has there.
#
# What a job checks is in scripts/ci/<job>.sh, which the job of the same check on GitHub
# calls too, so the two sides cannot come to ask different things. What a job installs
# differs by side and stays here. tests/test_ci_parity.py holds this.
stages:
  - test

# The linters and the unit tests run on every merge request and on main, whatever changed:
# they are quick.
.every-change:
  stage: test
  rules:
    # A scheduled pipeline is the Deep Agents canary's alone (deepagents-canary, below).
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

ruff:
  extends: .every-change
  # The Python that .python-version names.
  image: python:3.12-slim
  variables:
    UV_LINK_MODE: copy
  before_script:
    - pip install --quiet "uv==0.12.*"
    # Ruff comes from uv.lock, so CI checks with the version a developer has.
    - uv sync --locked
  script:
    - scripts/ci/ruff.sh

# The types of the service and of its tests. The same job runs on GitHub from lint.yml, and
# the commit hook runs the script's command.
pyright:
  extends: .every-change
  # The Python that .python-version names.
  image: python:3.12-slim
  variables:
    UV_LINK_MODE: copy
  before_script:
    - pip install --quiet "uv==0.12.*"
    # pyright comes from uv.lock at one exact version, with the Node it runs on, and checks
    # the code against the packages the lock file installs.
    - uv sync --locked
  script:
    - scripts/ci/pyright.sh

biome:
  extends: .every-change
  image: node:26-slim
  before_script:
    - npm install -g pnpm@12
    - pnpm --dir web install --frozen-lockfile
  script:
    - scripts/ci/biome.sh

# Secrets in any commit. The same job runs on GitHub from secrets.yml, and the commit hook
# runs the same version over what is staged: change the three together.
gitleaks:
  extends: .every-change
  image:
    name: zricethezav/gitleaks:v8.30.1
    # The image starts gitleaks itself; the job needs a shell.
    entrypoint: [""]
  variables:
    # Every commit, not only the last: a secret stays in the history after it is removed.
    GIT_DEPTH: 0
  script:
    - scripts/ci/gitleaks.sh

pytest:
  extends: .every-change
  # The Python that .python-version names.
  image: python:3.12-slim
  services:
    # For the Postgres tests under tests/integration. The same container as
    # docker-compose.yml, reached under its alias and made with the database those tests
    # may wipe, from the three POSTGRES_ variables below.
    - name: postgres:17-alpine
      alias: postgres
  variables:
    # The cache and the environment may sit on different file systems on a runner.
    UV_LINK_MODE: copy
    POSTGRES_USER: freyja
    POSTGRES_PASSWORD: freyja
    POSTGRES_DB: freyja_test
    # Has the Postgres tests run; without it they would be skipped and the run would fall
    # below the floor.
    FREYJA_TEST_DATABASE_URI: postgresql://freyja:freyja@postgres:5432/freyja_test
  before_script:
    - pip install --quiet "uv==0.12.*"
    # --locked fails when uv.lock is out of step with pyproject.toml instead of rewriting it.
    - uv sync --locked
  script:
    # With the Postgres tests under tests/integration, against the service above.
    - scripts/ci/pytest.sh

vitest:
  extends: .every-change
  image: node:26-slim
  before_script:
    - npm install -g pnpm@12
    - pnpm --dir web install --frozen-lockfile
  script:
    - scripts/ci/vitest.sh

playwright:
  stage: test
  # The image carries the browsers and their system packages. Its version must equal
  # the @playwright/test version in web/pnpm-lock.yaml; change both together.
  image: mcr.microsoft.com/playwright:v1.65.1-noble
  rules:
    # Not in a scheduled pipeline, where `changes` counts as true (see .every-change).
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - web/**/*
        - .gitlab-ci.yml
        - scripts/ci/playwright.sh
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - web/**/*
        - .gitlab-ci.yml
        - scripts/ci/playwright.sh
  before_script:
    - npm install -g pnpm@12
    - pnpm --dir web install --frozen-lockfile
  script:
    - scripts/ci/playwright.sh
  artifacts:
    when: always
    paths:
      - web/playwright-report/
    expire_in: 30 days

# Trivy over the source: known vulnerabilities in what uv.lock and web/pnpm-lock.yaml install,
# and mistakes in the Dockerfiles. The same job runs on GitHub from scan.yml: change the
# version in both. GitHub also builds, runs, and scans the two images; that job has no twin
# here, because building an image needs a runner that allows it. The dev deploy pipeline
# scans the images it builds.
trivy:
  extends: .every-change
  image:
    name: aquasec/trivy:0.76.2
    # The image starts Trivy itself; the job needs a shell.
    entrypoint: [""]
  script:
    - scripts/ci/trivy.sh

# Semgrep over the source. The same job runs on GitHub from scan.yml: change the version in
# both.
semgrep:
  extends: .every-change
  image: semgrep/semgrep:1.178.0
  script:
    - scripts/ci/semgrep.sh

# The Deep Agents canary: pyright and the Python suite against a newer Deep Agents than
# uv.lock names, so that what an upgrade breaks is learned the week the release comes out.
# The same job runs on GitHub from deepagents-canary.yml, where each step says what it is
# for; tests/test_deepagents_canary.py keeps the two in step. It runs in a scheduled
# pipeline and in no other, and a scheduled pipeline runs nothing else. The schedule is not
# in this file: it is made once in the project's settings (Build, Pipeline schedules), weekly
# and for main, and its play button starts the canary by hand. It is the one job with a
# twin that calls no script of scripts/ci: it upgrades a package before its gate, which a
# script does not do, and runs the gate without `uv run`'s sync, as no other job does.
deepagents-canary:
  stage: test
  # The Python that .python-version names.
  image: python:3.12-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  parallel:
    matrix:
      # The newest release the pin in pyproject.toml allows.
      - LEG: inside the pin
        UPGRADE: uv sync --upgrade-package deepagents
        GATE: [pyright, pytest]
      # The newest release of all, past the pin.
      - LEG: newest release
        UPGRADE: uv pip install --upgrade-package deepagents deepagents
        GATE: [pyright, pytest]
  variables:
    UV_LINK_MODE: copy
  before_script:
    - pip install --quiet "uv==0.12.*"
    - uv sync --locked
  script:
    # In this job's environment only: nothing it upgrades is committed.
    - $UPGRADE
    - uv pip show deepagents
    # Says which requirements the upgrade broke, and fails nothing.
    - uv pip check || true
    # --no-sync: `uv run` would otherwise put back what the lock file names.
    - uv run --no-sync $GATE
