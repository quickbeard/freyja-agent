repos:
  # Files as they are kept: no whitespace at the end of a line, one newline at the end of a
  # file, YAML that parses, and no marker a merge left behind. The first two change the file;
  # what Spec Kit generates is left as Spec Kit writes it.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: &generated ^(\.specify|\.claude/skills|\.agents/skills)/
      - id: end-of-file-fixer
        exclude: *generated
      - id: check-yaml
        # pnpm writes its lock file as two YAML documents.
        exclude: ^web/pnpm-lock\.yaml$
      - id: check-merge-conflict
  # Secrets in what is about to be committed. pre-commit builds gitleaks itself at this
  # version, so nothing is installed by hand. The rules and the made-up keys of the tests
  # that are let through are in .gitleaks.toml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      # The type checker over the service's code, at the version uv.lock names, which is the
      # one CI runs. It reads the whole of src/ whatever was staged, since a change to one
      # file can break another's types, and runs when the code or what it is checked
      # against changes. It changes no file. Its settings are in pyproject.toml.
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        files: ^(src/|pyproject\.toml$|uv\.lock$)
        pass_filenames: false
      - id: pytest
        name: pytest
        # --cov: with coverage, held to fail_under in pyproject.toml.
        entry: uv run pytest -q --cov
        language: system
        pass_filenames: false
        always_run: true
      # The web app's gates run when a file under web/ is staged. They run the scripts in
      # web/package.json, so the hook needs Node and pnpm on the path and `pnpm install` done
      # in web/.
      - id: biome
        name: biome check (web)
        entry: pnpm --dir web run lint --write
        language: system
        files: ^web/
        pass_filenames: false
      - id: vitest
        name: vitest (web)
        # With coverage, held to the thresholds in web/vitest.config.mts.
        entry: pnpm --dir web run test:coverage
        language: system
        files: ^web/
        pass_filenames: false
