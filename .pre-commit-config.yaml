repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
      # The web app's gates run when a file under web/ is staged. They run the scripts in
      # web/package.json, so the hook needs Node and pnpm on the path and `pnpm install` done
      # in web/.
      - id: biome
        name: biome check (web)
        entry: pnpm --dir web run lint --write
        language: system
        files: ^web/
        pass_filenames: false
      - id: vitest
        name: vitest (web)
        entry: pnpm --dir web run test
        language: system
        files: ^web/
        pass_filenames: false
