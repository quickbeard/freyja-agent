name: Secrets
# gitleaks searches every commit for keys, tokens, and passwords. Its rules, and the made-up
# keys of the tests that are let through, are in .gitleaks.toml. The commit hook runs the same
# version over what is staged, so this job is for a commit made without the hook.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  gitleaks:
    name: gitleaks
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      # The version .pre-commit-config.yaml and .gitlab-ci.yml name; change the three together.
      # The checksum is the release's own, from its checksums file.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          # Every commit, not only the last: a secret stays in the history after it is removed.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Run gitleaks
        # --redact: a finding is reported without the value, which a log would keep.
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
