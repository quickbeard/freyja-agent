name: Unit Tests
# Both suites run on every change: they are quick, and a check that always runs can be made
# a required one. The end-to-end tests have their own workflow (playwright.yml).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python:
    name: pytest
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      # For the Postgres tests under tests/integration. The same container as
      # docker-compose.yml, made with the database those tests may wipe.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: freyja
          POSTGRES_PASSWORD: freyja
          POSTGRES_DB: freyja_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U freyja -d freyja_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - name: Install dependencies
        # uv installs the Python that .python-version names. --locked fails when uv.lock is
        # out of step with pyproject.toml instead of rewriting it.
        run: uv sync --locked
      - name: Run pytest
        # The variable has the Postgres tests under tests/integration run, against the
        # service above; without it they would be skipped and the run would fall below the
        # floor. --cov: with coverage, held to fail_under in pyproject.toml.
        env:
          FREYJA_TEST_DATABASE_URI: postgresql://freyja:freyja@localhost:5432/freyja_test
        run: uv run pytest --cov
  web:
    name: vitest
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm install -g pnpm@12 && pnpm install --frozen-lockfile
      - name: Run Vitest
        # With coverage, held to the thresholds in web/vitest.config.mts.
        run: pnpm test:coverage
