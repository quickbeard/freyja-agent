name: Unit Tests
# Both suites run on every change: they are quick, and a check that always runs can be made
# a required one. The end-to-end tests have their own workflow (playwright.yml).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python:
    name: pytest
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - name: Install dependencies
        # uv installs the Python that .python-version names. --locked fails when uv.lock is
        # out of step with pyproject.toml instead of rewriting it.
        run: uv sync --locked
      - name: Run pytest
        # The Postgres tests under tests/integration are skipped: they are opt-in and need
        # FREYJA_TEST_DATABASE_URI.
        run: uv run pytest
  web:
    name: vitest
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm install -g pnpm@12 && pnpm install --frozen-lockfile
      - name: Run Vitest
        run: pnpm test
