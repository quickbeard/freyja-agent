name: Lint
# Ruff for the service and Biome for the web app, each checking lint and formatting. They
# report and change nothing; the commit hook is where files get fixed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python:
    name: ruff
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        # Ruff comes from uv.lock, so CI checks with the version a developer has.
        run: uv sync --locked
      - name: Run ruff check
        run: uv run ruff check --output-format=github .
      - name: Run ruff format
        run: uv run ruff format --check .
  web:
    name: biome
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm install -g pnpm@12 && pnpm install --frozen-lockfile
      - name: Run biome check
        # Lint and formatting in one command.
        run: pnpm lint
