name: Lint
# Ruff for the service and Biome for the web app, each checking lint and formatting, and
# pyright checking the types of the service and of its tests. They report and change
# nothing; the commit hook is where files get fixed. What each job checks is in
# scripts/ci/<job>.sh, which GitLab's job of the same name calls too
# (tests/test_ci_parity.py).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python:
    name: ruff
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - name: Install dependencies
        # Ruff comes from uv.lock, so CI checks with the version a developer has.
        run: uv sync --locked
      - name: Run Ruff
        # ruff check and ruff format --check; on GitHub a finding is written as an annotation.
        run: scripts/ci/ruff.sh
  types:
    name: pyright
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - name: Install dependencies
        # pyright comes from uv.lock at one exact version, with the Node it runs on, and
        # checks the code against the packages the lock file installs.
        run: uv sync --locked
      - name: Run pyright
        run: scripts/ci/pyright.sh
  web:
    name: biome
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm install -g pnpm@12 && pnpm --dir web install --frozen-lockfile
      - name: Run biome check
        run: scripts/ci/biome.sh
